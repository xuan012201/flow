<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow — try it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#F4F6FA; --surface:#FFF; --ink:#14171D; --ink2:#59606D; --ink3:#98A0AE;
    --brand:#0B5CFF; --soft:#E8F0FF; --line:#E6E9EF; --warn:#EB6834; --good:#12A150;
    --r:18px;
    --sans:'Inter','Noto Sans SC',system-ui,-apple-system,"Segoe UI",sans-serif;
    --disp:'Poppins','Noto Sans SC',system-ui,sans-serif;
    --gx:50%; --gy:30%; --fov:118px;
  }
  html{height:100%}
  body{margin:0;min-height:100%;background:var(--bg);font-family:var(--sans);color:var(--ink);
    -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.65}
  .wrap{max-width:1220px;margin:0 auto;padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;
    gap:clamp(14px,2vw,22px)}

  /* ── header ─────────────────────────────── */
  .head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .head .tx{flex:1 1 340px;min-width:260px}
  .head h1{font-family:var(--disp);font-size:clamp(21px,2.4vw,30px);font-weight:600;margin:0 0 8px;letter-spacing:-.02em;line-height:1.25}
  .head p{margin:0;font-size:clamp(13.5px,1.15vw,15.5px);color:var(--ink2);line-height:1.65;max-width:640px}
  .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .seg{display:flex;background:#E9ECF2;border-radius:99px;padding:3px}
  .seg button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);
    padding:6px 13px;border-radius:99px;cursor:pointer;transition:.18s;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,23,29,.13)}
  .ghost{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font:inherit;
    font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.18s;white-space:nowrap}
  .ghost:hover{border-color:var(--brand);color:var(--brand)}

  /* ── section shell ──────────────────────── */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2vw,26px)}
  .stephd{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .stephd .n{width:26px;height:26px;border-radius:99px;background:var(--ink);color:#fff;display:grid;
    place-items:center;font-size:12.5px;font-weight:700;flex:none;font-family:var(--disp)}
  .stephd h2{font-family:var(--disp);font-size:clamp(16px,1.5vw,19px);font-weight:600;margin:0;letter-spacing:-.01em}
  .stepdesc{font-size:clamp(13px,1.1vw,14.5px);color:var(--ink2);margin:0 0 18px;max-width:640px;line-height:1.7}
  .stepdesc b{color:var(--ink);font-weight:600}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,320px);gap:clamp(16px,2.2vw,30px);align-items:stretch}

  /* ── device ─────────────────────────────── */
  .stage{background:linear-gradient(165deg,#EFF3F9,#E3E9F3);border-radius:14px;display:flex;align-items:center;
    justify-content:center;padding:clamp(14px,2vw,26px);position:relative;min-height:0;height:clamp(430px,58vh,560px)}
  .device{position:relative;background:#fff;display:flex;flex-direction:column;overflow:hidden;
    transition:width .4s cubic-bezier(.2,.8,.3,1),border-radius .4s,max-width .4s}
  .device.phone{width:min(318px,100%);height:100%;border-radius:34px;border:8px solid #14171D;
    box-shadow:0 24px 56px -18px rgba(20,23,29,.4)}
  .device.desktop{width:100%;max-width:640px;height:100%;border-radius:12px;border:1px solid #D6DBE4;
    box-shadow:0 22px 50px -20px rgba(20,23,29,.32)}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:96px;height:20px;background:#14171D;
    border-radius:0 0 12px 12px;z-index:9}
  .device.desktop .notch{display:none}
  .statusbar{display:flex;justify-content:space-between;padding:6px 18px 2px;font-size:10px;font-weight:600;flex:none}
  .statusbar .rt{display:flex;gap:3px;align-items:center}
  .statusbar .rt i{width:3px;height:3px;border-radius:99px;background:var(--ink3);display:block}
  .statusbar .rt i:nth-child(1){height:5px}.statusbar .rt i:nth-child(2){height:7px}
  .device.desktop .statusbar{display:none}
  .winbar{display:none;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line);
    background:#F7F8FA;flex:none}
  .device.desktop .winbar{display:flex}
  .winbar .tl{display:flex;gap:5px}
  .winbar .tl i{width:9px;height:9px;border-radius:99px;display:block;background:#DDE1E8}
  .winbar .url{flex:1;background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px 11px;
    font-size:10.5px;color:var(--ink3);text-align:center;max-width:250px;margin:0 auto}
  .appbar{display:flex;align-items:center;justify-content:space-between;padding:4px 17px 8px;flex:none;gap:10px}
  .appbar span{font-size:10.5px;color:var(--ink3)}
  .device.desktop .appbar{padding:9px 24px 5px}

  .pane{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:0 17px 22px;scrollbar-width:none;cursor:crosshair}
  .pane::-webkit-scrollbar{display:none}
  .device.desktop .pane{padding:0 clamp(22px,5%,44px) 24px}
  .pagewrap{position:relative}
  .layer{position:relative;z-index:2}
  .layer.blurred{position:absolute;left:0;right:0;top:0;z-index:1;filter:blur(2.7px);pointer-events:none;user-select:none}
  .lens .layer.sharp{
    -webkit-mask-image:radial-gradient(circle var(--fov) at var(--gx) var(--gy),#000 0%,#000 44%,rgba(0,0,0,.35) 74%,transparent 100%);
    mask-image:radial-gradient(circle var(--fov) at var(--gx) var(--gy),#000 0%,#000 44%,rgba(0,0,0,.35) 74%,transparent 100%)}

  h3.hd{font-family:var(--disp);font-size:15px;line-height:1.3;margin:4px 0 3px;font-weight:600}
  .byline{font-size:10px;color:var(--ink3);margin-bottom:2px}
  .p{margin:13px 0;font-size:13.5px;line-height:1.9}
  .device.desktop .p{font-size:14.5px}
  .w{border-radius:4px;transition:background-color .35s}
  .w.held{background:var(--soft)}
  .w.frontier{background:var(--soft);box-shadow:inset 0 -2px 0 rgba(11,92,255,.45)}

  .hintarrow{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:18;text-align:center;
    pointer-events:none;transition:opacity .5s}
  .hintarrow .bub{background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:10px 15px;border-radius:11px;
    line-height:1.5;max-width:210px;box-shadow:0 10px 26px -8px rgba(0,0,0,.4);animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .hintarrow.off{opacity:0}

  .helpnote{position:absolute;left:11px;right:11px;bottom:11px;background:var(--ink);color:#fff;border-radius:11px;
    padding:9px 12px;font-size:11.5px;line-height:1.5;z-index:15;transform:translateY(140%);opacity:0;
    transition:.45s cubic-bezier(.2,.85,.25,1);display:flex;gap:8px;align-items:center}
  .helpnote.show{transform:none;opacity:1}
  .helpnote i{width:6px;height:6px;border-radius:99px;background:#5EE08A;flex:none}

  .gaze{position:absolute;width:16px;height:16px;border-radius:99px;pointer-events:none;z-index:12;
    transform:translate(-50%,-50%);transition:opacity .3s}
  .gaze::before{content:"";position:absolute;inset:0;border-radius:99px;border:1.5px solid rgba(11,92,255,.8);
    box-shadow:0 0 0 5px rgba(11,92,255,.11)}
  .gaze.hide{opacity:0}

  .veil{position:absolute;inset:0;background:rgba(244,246,250,.93);backdrop-filter:blur(4px);display:grid;
    place-items:center;opacity:0;pointer-events:none;transition:.45s;z-index:14;text-align:center;padding:20px}
  .device.away .veil{opacity:1}
  .ring{width:40px;height:40px;margin:0 auto 12px;border-radius:99px;border:2px solid var(--line);
    border-top-color:var(--brand);animation:spin 2.6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .veil strong{display:block;font-family:var(--disp);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .veil small{display:block;font-size:11.5px;color:var(--ink2);margin-top:6px;line-height:1.6;max-width:210px}

  .sheet{position:absolute;left:11px;right:11px;bottom:11px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;box-shadow:0 18px 44px -12px rgba(20,23,29,.32);padding:15px 16px;z-index:16;
    transform:translateY(140%);opacity:0;transition:transform .55s cubic-bezier(.2,.85,.25,1),opacity .4s;
    max-height:78%;overflow-y:auto;scrollbar-width:none}
  .sheet::-webkit-scrollbar{display:none}
  .sheet.show{transform:none;opacity:1}
  .sheet .st{font-family:var(--disp);font-size:13px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .sheet .st i{width:19px;height:19px;border-radius:6px;background:var(--brand);display:grid;place-items:center;flex:none}
  .sheet .lbl{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--ink3);margin:0 0 4px}
  .sheet .quote{border-left:2px solid var(--brand);padding:2px 0 2px 10px;font-size:12.5px;line-height:1.6;margin:0 0 11px}
  .sheet .rec{font-size:12px;line-height:1.65;color:var(--ink2);margin:0 0 13px}
  .sheet button{border:0;background:var(--brand);color:#fff;font:inherit;font-size:12.5px;font-weight:600;
    padding:9px 15px;border-radius:9px;cursor:pointer;width:100%}

  /* ── side panel ─────────────────────────── */
  .side{display:flex;flex-direction:column;gap:14px;min-width:0}
  .panel{background:#FAFBFD;border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .panel .ph{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink3);margin:0 0 12px}
  .row{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0;padding-top:0}
  .row .k{font-size:13px;color:var(--ink2);flex:1;line-height:1.4}
  .row .v{font-size:13.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .pips{display:flex;gap:3px}
  .pips i{width:9px;height:9px;border-radius:2px;background:#E1E5EC;display:block}
  .pips i.on{background:var(--brand)}
  .pips i.on.warn{background:var(--warn)}
  .fw{font-size:12px;font-weight:600;color:var(--ink2)}

  .bigbtn{border:0;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:600;padding:13px;
    border-radius:11px;cursor:pointer;width:100%;transition:.18s}
  .bigbtn:hover{background:#000}
  .bigbtn.blue{background:var(--brand)} .bigbtn.blue:hover{background:#0A50E0}
  .chips{display:flex;gap:6px;margin-bottom:11px}
  .chips button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 4px;cursor:pointer;
    font:inherit;font-size:11px;color:var(--ink3);transition:.18s;line-height:1.35}
  .chips button b{display:block;font-size:13px;color:var(--ink);font-weight:600;margin-bottom:1px}
  .chips button[aria-pressed="true"]{border-color:var(--brand);background:#F6FAFF;box-shadow:0 0 0 3px rgba(11,92,255,.08)}
  .aside{font-size:12px;color:var(--ink3);line-height:1.6;margin:12px 0 0}
  .aside b{color:var(--ink2)}

  /* ── findings ───────────────────────────── */
  .finds{display:flex;flex-direction:column;gap:12px}
  .find{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px 17px;
    background:#FAFBFD;animation:rise .45s both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .find .vis{flex:none;width:104px}
  .find .tx{flex:1;font-size:clamp(13px,1.1vw,14.5px);line-height:1.65;color:var(--ink2)}
  .find .tx b{color:var(--ink);font-weight:600}
  .strip{display:flex;gap:2px;height:26px}
  .strip i{flex:1;border-radius:3px;background:#E6E9EF;display:block}
  .strip i.read{background:var(--brand)}
  .strip i.skim{background:#9EC5F4}
  .strip i.gapx{background:repeating-linear-gradient(135deg,#F0F2F6 0 3px,#C9CFD9 3px 4px);box-shadow:inset 0 0 0 1px #D8DDE5}
  .dots{display:flex;gap:5px;flex-wrap:wrap;align-items:center;height:26px}
  .dots i{width:11px;height:11px;border-radius:99px;background:var(--warn);display:block}
  .fade{height:26px;border-radius:4px;background:linear-gradient(90deg,var(--brand) 0%,var(--brand) 36%,#9EC5F4 60%,#E6E9EF 100%);position:relative}
  .fade b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:54%;border-radius:2px}
  .empty{border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--ink3);
    font-size:13.5px;line-height:1.7}

  /* ── changes + before/after ─────────────── */
  .changes{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
  .chg{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    background:#fff;cursor:pointer;transition:.18s;animation:rise .4s both}
  .chg:hover{border-color:#BFD4FF}
  .chg[aria-checked="true"]{border-color:var(--brand);background:#F7FAFF}
  .box{width:19px;height:19px;border-radius:6px;border:1.5px solid #C6CCD6;flex:none;margin-top:2px;display:grid;
    place-items:center;transition:.15s}
  .chg[aria-checked="true"] .box{background:var(--brand);border-color:var(--brand)}
  .box svg{opacity:0;transition:.15s}
  .chg[aria-checked="true"] .box svg{opacity:1}
  .chg .t{font-size:13.5px;line-height:1.55;color:var(--ink)}
  .chg .t small{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
  .applyrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  .applyrow .bigbtn{width:auto;padding:12px 24px}
  .applied{font-size:12.5px;color:var(--good);font-weight:600}

  .ba{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,26px)}
  .bacol{display:flex;flex-direction:column;gap:9px}
  .balbl{font-size:12.5px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:7px}
  .balbl i{width:7px;height:7px;border-radius:99px;background:#C6CCD6;display:block}
  .balbl.after{color:var(--brand)} .balbl.after i{background:var(--brand)}
  .mini{width:100%;max-width:280px;margin:0 auto;border:7px solid #14171D;border-radius:26px;background:#fff;
    overflow:hidden;position:relative;box-shadow:0 14px 32px -14px rgba(20,23,29,.34);transition:border-color .3s}
  .mini.hl{border-color:var(--brand);box-shadow:0 16px 38px -12px rgba(11,92,255,.3)}
  .mini .nt{position:absolute;top:0;left:50%;transform:translateX(-50%);width:70px;height:14px;background:#14171D;
    border-radius:0 0 9px 9px;z-index:3}
  .mini.hl .nt{background:var(--brand)}
  .mini .sb{display:flex;justify-content:space-between;padding:5px 13px 2px;font-size:8px;font-weight:600}
  .mini .ab{font-size:8.5px;color:var(--ink3);text-align:center;padding:1px 0 7px}
  .mini .bd{padding:0 14px 16px;font-size:10px;line-height:1.85;color:var(--ink);height:292px;overflow:hidden;
    -webkit-mask-image:linear-gradient(#000 88%,transparent 100%);mask-image:linear-gradient(#000 88%,transparent 100%)}
  .mini p{margin:0 0 9px}
  .mini .mk{display:inline-block;font-size:7.5px;font-weight:700;letter-spacing:.05em;background:var(--brand);
    color:#fff;padding:2px 8px;border-radius:99px;margin-bottom:8px}
  .mini .st{border-left:2px solid var(--soft);padding-left:9px;margin:0 0 10px}
  .mini .st .sh{font-size:8px;font-weight:700;letter-spacing:.05em;color:var(--brand);margin-bottom:2px}
  .mini .high{background:var(--soft);border-radius:3px;padding:0 2px}
  .mini .pill{display:flex;gap:7px;align-items:center;background:#FFF6F0;border:1px solid #F5D9C6;border-radius:8px;
    padding:7px 9px;font-size:9px;line-height:1.5;color:#7A4A2C;margin:0 0 10px}
  .mini .brk{display:flex;align-items:center;gap:7px;margin:11px 0}
  .mini .brk .ln{flex:1;height:1px;background:var(--line)}
  .mini .brk .tg{font-size:7.5px;font-weight:700;color:var(--good);background:#F0FAF4;border:1px solid #C9EBD8;
    padding:2px 8px;border-radius:99px;white-space:nowrap}
  .bacap{font-size:12px;color:var(--ink3);line-height:1.6;text-align:center;margin:2px auto 0;max-width:280px}

  .foot{font-size:12px;color:var(--ink3);line-height:1.7;text-align:center;padding:4px 0 10px;max-width:660px;margin:0 auto}

  @media (max-width:900px){
    .split{grid-template-columns:1fr}
    .stage{height:clamp(400px,52vh,500px)}
    .ba{grid-template-columns:1fr}
  }
  @media (max-width:560px){
    .find{flex-direction:column;align-items:flex-start;gap:11px}
    .find .vis{width:100%}
    .device.phone{width:100%;border-radius:28px;border-width:6px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.06s!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="tx"><h1 id="ttl"></h1><p id="sub"></p></div>
    <div class="ctl">
      <div class="seg" role="group" id="devSeg">
        <button data-dev="phone" aria-pressed="true"></button>
        <button data-dev="desktop" aria-pressed="false"></button>
      </div>
      <div class="seg" role="group">
        <button data-lang="en" aria-pressed="true">English</button>
        <button data-lang="zh" aria-pressed="false">中文</button>
      </div>
      <button class="ghost" id="reset"></button>
    </div>
  </div>

  <!-- STEP 1 + 2 -->
  <div class="card">
    <div class="stephd"><span class="n">1</span><h2 id="h1"></h2></div>
    <p class="stepdesc" id="d1"></p>

    <div class="split">
      <div class="stage">
        <div class="device phone lens" id="device">
          <div class="notch"></div>
          <div class="statusbar"><span id="clk">9:41</span><span class="rt"><i></i><i></i><i></i></span></div>
          <div class="winbar"><span class="tl"><i></i><i></i><i></i></span><span class="url">flow.reading</span></div>
          <div class="appbar"><span>‹</span><span id="apptitle"></span><span style="opacity:.4">···</span></div>
          <div class="pane" id="pane">
            <div class="pagewrap">
              <div class="layer blurred" id="lBlur" aria-hidden="true"></div>
              <div class="layer sharp" id="lSharp"></div>
            </div>
          </div>
          <div class="gaze" id="gaze"></div>
          <div class="hintarrow" id="hintArrow"><div class="bub" id="hintTx"></div></div>
          <div class="helpnote" id="helpNote"><i></i><span></span></div>
          <div class="veil"><div><div class="ring"></div><strong id="awayClock">00:00</strong><small id="awayNote"></small></div></div>
          <div class="sheet" id="sheet"></div>
        </div>
      </div>

      <div class="side">
        <div class="panel">
          <p class="ph" id="phSee"></p>
          <div class="row"><span class="k" id="k1"></span><span class="v" id="v1">—</span></div>
          <div class="row"><span class="k" id="k2"></span><span class="v"><span class="pips" id="v2"></span><span class="fw" id="v2w"></span></span></div>
          <div class="row"><span class="k" id="k3"></span><span class="v" id="v3">—</span></div>
        </div>

        <div class="panel" style="flex:1;display:flex;flex-direction:column">
          <div class="stephd" style="margin-bottom:6px"><span class="n">2</span><h2 id="h2" style="font-size:15px"></h2></div>
          <p style="font-size:12.5px;color:var(--ink2);margin:0 0 13px;line-height:1.6" id="d2"></p>
          <div class="chips" id="chips"></div>
          <button class="bigbtn" id="go"></button>
          <p class="aside" id="aside2"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="card">
    <div class="stephd"><span class="n">3</span><h2 id="h3"></h2></div>
    <p class="stepdesc" id="d3"></p>
    <div class="finds" id="finds"></div>
  </div>

  <!-- STEP 4 -->
  <div class="card">

const DENSE=[2,4], DEP_P=3, DEP_ON=5;

let lang='en', C=T.en, dev='phone';
let words=[], sharpW=[], blurW=[];

const device=el('device'), pane=el('pane'), gazeEl=el('gaze');

/* ── text ─────────────────────────────────────────────────── */
function tokens(t){ return lang==='zh' ? (t.match(/.{1,2}/g)||[]) : t.split(/\s+/).filter(Boolean); }
function sentences(t){ return t.split(/(?<=[.。？?！!])\s*/).filter(s=>s.trim()); }
function buildText(){
  let h='<div class="byline">'+C.byline+'</div><h3 class="hd">'+C.apptitle+'</h3>';
  let wi=0;
  C.para.forEach((txt,pi)=>{
    h+='<div class="p" data-p="'+pi+'">';
    sentences(txt).forEach((sn,si)=>{
      tokens(sn).forEach(w=>{
        h+='<span class="w" data-i="'+wi+'" data-p="'+pi+'" data-s="'+si+'">'+w+(lang==='zh'?'':' ')+'</span>';
        wi++;
      });
    });
    h+='</div>';
  });
  el('lSharp').innerHTML=h; el('lBlur').innerHTML=h;
  sharpW=[...el('lSharp').querySelectorAll('.w')];
  blurW=[...el('lBlur').querySelectorAll('.w')];
  measure();
  readMs=C.para.map(()=>0);
  seenW=C.para.map(()=>new Set());
  totW=C.para.map(()=>0);
  words.forEach(w=>totW[w.p]++);
  expMs=C.para.map((t,i)=>tokens(t).length*(lang==='zh'?105:165)*(DENSE.includes(i)?1.2:1));
}
function measure(){
  const base=el('lSharp').getBoundingClientRect();
  words=sharpW.map((w,i)=>{
    const r=w.getBoundingClientRect();
    return {el:w,x:r.left-base.left+r.width/2,y:r.top-base.top+r.height/2,
            p:+w.dataset.p,s:+w.dataset.s,i};
  });
}

/* ── gaze loop ────────────────────────────────────────────── */
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(60,now-(frame.last||now)); frame.last=now;
  if(!away && mouse.in){
    const r=pane.getBoundingClientRect();
    const mx=mouse.x-r.left+pane.scrollLeft, my=mouse.y-r.top+pane.scrollTop;
    if(Math.hypot(mx-tx,my-ty)>24){
      let best=null,bd=1e9;
      for(const w of words){const d=Math.hypot(w.x-mx,w.y-my); if(d<bd){bd=d;best=w;}}
      if(best&&bd<150){tx=best.x;ty=best.y;land(best,now);} else {tx=mx;ty=my;}
    }
    if(curP>=0) readMs[curP]+=dt;
    const dwell=(now-dwellStart)/1000;
    if(dwell>1.4 && curW>=0) hold();
    focus=clamp(focus-(dwell>1.4?0.020:0.0058+(DENSE.includes(curP)?0.004:0))*dt,12,100);
    if(focus<46 && dropAtP===null && curP>=0 && now-sessionStart>15000) dropAtP=curP+1;
  }
  gx+=(tx-gx)*Math.min(1,dt/32); gy+=(ty-gy)*Math.min(1,dt/32);
  const px=gx+(Math.random()-.5)*1.5, py=gy+(Math.random()-.5)*1.1;
  device.style.setProperty('--gx',px+'px'); device.style.setProperty('--gy',py+'px');
  gazeEl.style.left=(px-pane.scrollLeft+pane.offsetLeft)+'px';
  gazeEl.style.top=(py-pane.scrollTop+pane.offsetTop)+'px';
  gazeEl.classList.toggle('hide',away||!mouse.in);
  paintSide();
}
function land(w,now){
  if(w.i===curW)return;
  if(curW>=0 && w.i<curW-2 && w.i<maxW-2 && now-lastBackAt>900 && now-lastScrollAt>450
     && Math.abs(w.p-curP)<=1 && curW-w.i<60){
    lastBackAt=now; backs++; focus=clamp(focus-2.5,12,100);
  }
  curW=w.i; if(w.i>maxW)maxW=w.i;
  for(let k=w.i-1;k<=w.i+1;k++){const n=words[k]; if(n&&seenW[n.p])seenW[n.p].add(k);}
  if(w.p!==curP){curP=w.p; if(w.p>maxP)maxP=w.p;}
  if(!started){started=true; sessionStart=now; el('hintArrow').classList.add('off');}
  dwellStart=now;
  frontier={p:w.p,s:w.s};
}
function hold(){
  const w=words[curW]; if(!w||w.el.classList.contains('held'))return;
  sharpW.forEach(x=>x.classList.remove('held')); blurW.forEach(x=>x.classList.remove('held'));
  words.filter(x=>x.p===w.p&&x.s===w.s).forEach(x=>{
    x.el.classList.add('held'); if(blurW[x.i])blurW[x.i].classList.add('held');});
  const n=el('helpNote'); n.querySelector('span').textContent=C.helpStall;
  n.classList.add('show'); clearTimeout(hold.t); hold.t=setTimeout(()=>n.classList.remove('show'),3600);
}

/* ── side panel ───────────────────────────────────────────── */
function paintSide(){
  el('v1').textContent = curP<0 ? '—' : (lang==='zh' ? ('第 '+(curP+1)+' / '+C.para.length+' 段')
                                                     : ((curP+1)+' of '+C.para.length));
  const lvl = focus>72?0:(focus>48?1:2), on = focus>72?5:(focus>48?3:2);
  let pips=''; for(let i=0;i<5;i++)pips+='<i class="'+(i<on?'on'+(lvl?' warn':''):'')+'"></i>';
  el('v2').innerHTML=pips; el('v2w').textContent=C.focusWords[lvl];
  el('v3').textContent = backs===0 ? (lang==='zh'?'0 次':'none')
                                   : (lang==='zh'? backs+' 次' : backs+(backs>1?' times':' time'));
}

/* ── step 2 ───────────────────────────────────────────────── */
const SECS=[30,12*60,2*24*3600];
function fmtClock(s){
  if(s>=86400){const d=Math.floor(s/86400);return lang==='zh'?(d+' 天'):(d+(d>1?' days':' day'));}
  if(s>=3600)return Math.floor(s/3600)+(lang==='zh'?' 小时':'h');
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
}
function leave(){
  if(!frontier){ const a=el('hintArrow'); el('hintTx').textContent=C.needRead;
    a.classList.remove('off'); setTimeout(()=>{el('hintTx').textContent=C.hint; if(started)a.classList.add('off');},2400); return; }
  away=true; device.classList.add('away');
  el('go').textContent=C.back; el('go').classList.add('blue');
  const total=SECS[tier], st=performance.now();
  const iv=setInterval(()=>{
    const k=Math.min(1,(performance.now()-st)/2200);
    el('awayClock').textContent=fmtClock(Math.round(total*k*k));
    if(k>=1)clearInterval(iv);
  },40);
}
function back(){
  away=false; device.classList.remove('away');
  el('go').textContent=C.go; el('go').classList.remove('blue');
  focus=clamp(focus+[4,18,34][tier],12,100);
  sharpW.forEach(w=>w.classList.remove('frontier'));
  words.filter(x=>x.p===frontier.p&&x.s===frontier.s).forEach(x=>x.el.classList.add('frontier'));
  const ss=sentences(C.para[frontier.p]);
  const q=ss[frontier.s]||ss[0];
  const lead=sentences(C.para[Math.min(C.para.length-1,frontier.p+1)])[0];
  el('sheet').innerHTML=
    '<p class="st"><i><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h13M12 5l7 7-7 7"/></svg></i>'+C.sheetT+'</p>'+
    '<p class="lbl">'+C.sheetQ+'</p><p class="quote">'+q+'</p>'+
    '<p class="lbl">'+C.sheetR+'</p><p class="rec">'+lead+'</p>'+
    '<button>'+C.sheetGo+'</button>';
  setTimeout(()=>el('sheet').classList.add('show'),340);
  el('sheet').querySelector('button').onclick=()=>{
    el('sheet').classList.remove('show');
    const w=words.find(x=>x.p===frontier.p&&x.s===frontier.s);
    if(w){tx=w.x;ty=w.y;pane.scrollTo({top:Math.max(0,w.y-pane.clientHeight*0.45),behavior:'smooth'});}
  };
  renderFinds(); renderChanges();
}

/* ── step 3 ───────────────────────────────────────────────── */
function cover(i){
  if(i>maxP)return 'un';
  const t=readMs[i]/Math.max(1,expMs[i]);            // did you spend the time
  const v=(seenW[i]?seenW[i].size:0)/Math.max(1,totW[i]); // did your eyes go over it
  if(v>0.45 && t>0.28) return 'read';
  if(v>0.15 || t>0.10) return 'skim';
  return 'skip';
}
function stats(){
  const st=C.para.map((_,i)=>cover(i));
  return {read:st.filter(x=>x==='read').length,
          skim:st.filter(x=>x==='skim'||x==='skip').length,
          un:st.filter(x=>x==='un').length, n:C.para.length, st};
}
function fill(s,v){return s.replace(/\{(\w+)\}/g,(m,k)=>v[k]!==undefined?v[k]:m);}
function renderFinds(){
  const host=el('finds');
  if(maxP<0){host.innerHTML='<div class="empty">'+C.emptyFind+'</div>';return;}
  const S=stats(), F=C.finds;
  const row=(vis,tx)=>'<div class="find"><div class="vis">'+vis+'</div><div class="tx">'+tx+'</div></div>';
  let out='';
  out+=row('<div class="strip">'+S.st.map(x=>'<i class="'+(x==='read'?'read':x==='skim'?'skim':x==='skip'?'gapx':'')+'"></i>').join('')+'</div>',
      S.read===S.n?fill(F.coverAll,{n:S.n}):fill(F.cover,{r:S.read,n:S.n,s:S.skim,u:S.un}));
  if(backs>=2){
    let d=''; for(let i=0;i<Math.min(backs,7);i++)d+='<i></i>';
    out+=row('<div class="dots">'+d+'</div>',fill(F.back,{n:backs}));
  }else{
    out+=row('<div class="dots" style="justify-content:center"><i style="background:#12A150"></i></div>',F.backNone);
  }
  if(dropAtP!==null) out+=row('<div class="fade"><b></b></div>',fill(F.focus,{p:dropAtP}));
  else out+=row('<div class="fade" style="background:var(--brand)"></div>',F.focusOK);
  if(cover(DEP_P-1)!=='read'&&maxP>=DEP_P-1){
    out+=row('<div class="strip">'+C.para.map((_,i)=>'<i class="'+(i===DEP_P-1?'gapx':i<=maxP?'read':'')+'"></i>').join('')+'</div>',
      fill(F.gap,{p:DEP_P,q:DEP_ON}));
  }
  host.innerHTML=out;
}

/* ── step 4 ───────────────────────────────────────────────── */
function changeList(){
  const S=stats(), out=[{k:'mark'}];
  if(S.read<S.n) out.push({k:'pace'});
  if(backs>=2) out.push({k:'anchor'});
  if(dropAtP!==null) out.push({k:'brk',m:Math.max(5,dropAtP*4)});
  if(cover(DEP_P-1)!=='read'&&maxP>=DEP_P-1) out.push({k:'gap',p:DEP_P});
  return out;
}
function renderChanges(){
  const host=el('changes'); host.innerHTML='';
  changeList().forEach(c=>{
    if(picks[c.k]===undefined)picks[c.k]=true;
    const t=C.chg[c.k];
    const b=document.createElement('div');
    b.className='chg'; b.setAttribute('role','checkbox'); b.setAttribute('aria-checked',picks[c.k]);
    b.innerHTML='<span class="box"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg></span>'+
      '<span class="t">'+fill(t[0],c)+'<small>'+fill(t[1],c)+'</small></span>';
    b.onclick=()=>{picks[c.k]=!picks[c.k];b.setAttribute('aria-checked',picks[c.k]);renderAfter();};
    host.appendChild(b);
  });
  renderAfter();
}
function shell(inner){
  const d=new Date(), t=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  return '<div class="nt"></div><div class="sb"><span>'+t+'</span><span>▪▪▪</span></div>'+
         '<div class="ab">'+C.mini.ab+'</div><div class="bd">'+inner+'</div>';
}
function renderBefore(){
  el('miniBefore').innerHTML=shell('<p>'+C.para[2]+'</p><p>'+C.para[3]+'</p>');
}
function renderAfter(){
  const on=k=>appliedNow&&picks[k];
  const ss=sentences(C.para[2]); const join=lang==='zh'?'':' ';
  let body='';
  if(on('mark')) body+='<span class="mk">'+C.mini.mark+'</span>';
  if(on('gap')) body+='<div class="pill"><span>'+fill(C.mini.pill,{p:DEP_P})+'</span></div>';
  if(on('pace')){
    [[0,0],[1,2],[3,ss.length-1]].forEach((r,i)=>{
      const txt=ss.slice(r[0],r[1]+1).join(join); if(!txt)return;
      body+='<div class="st"><div class="sh">'+(i+1)+' · '+C.mini.steps[i]+'</div><p style="margin:0">'+
        (on('anchor')&&i===1?'<span class="high">'+txt+'</span>':txt)+'</p></div>';
    });
  }else{
    body+='<p>'+(on('anchor')?ss.map((s,i)=>i===1?'<span class="high">'+s+'</span>':s).join(join):C.para[2])+'</p>';
  }
  const brk=changeList().find(x=>x.k==='brk');
  if(on('brk')&&brk) body+='<div class="brk"><span class="ln"></span><span class="tg">'+fill(C.mini.brk,{m:brk.m})+'</span><span class="ln"></span></div>';
  body+='<p>'+C.para[3]+'</p>';
  el('miniAfter').innerHTML=shell(body);
}

/* ── chrome ───────────────────────────────────────────────── */
function renderChrome(){
  ['ttl','sub','h1','d1','h2','d2','h3','d3','h4','d4','aside2','foot','phSee','k1','k2','k3',
   'baB','baA','capB','capA','appliedTx'].forEach(k=>{ if(el(k)&&C[k]!==undefined) el(k).innerHTML=C[k]; });
  el('apptitle').textContent=C.apptitle;
  el('hintTx').textContent=C.hint;
  el('awayNote').textContent=C.awayNote;
  el('reset').textContent=C.reset;
  el('apply').textContent=C.apply;
  el('undo').textContent=C.undo;
  el('go').textContent=away?C.back:C.go;
  [...el('devSeg').children].forEach((b,i)=>b.textContent=C.dev[i]);
  const ch=el('chips'); ch.innerHTML='';
  C.chips.forEach((c,i)=>{
    const b=document.createElement('button'); b.setAttribute('aria-pressed',i===tier);
    b.innerHTML='<b>'+c[0]+'</b>'+c[1];
    b.onclick=()=>{tier=i;[...ch.children].forEach((x,k)=>x.setAttribute('aria-pressed',k===i));};
    ch.appendChild(b);
  });
  const d=new Date(); el('clk').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ── events ───────────────────────────────────────────────── */
pane.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.in=true;},{passive:true});
pane.addEventListener('mouseleave',()=>{mouse.in=false;});
pane.addEventListener('scroll',()=>{lastScrollAt=performance.now();},{passive:true});
el('go').onclick=()=>{away?back():leave();};
el('apply').onclick=()=>{
  appliedNow=true; renderAfter();
  el('apply').style.display='none'; el('undo').style.display=''; el('appliedTx').style.display='';
};
el('undo').onclick=()=>{
  appliedNow=false; renderAfter();
  el('apply').style.display=''; el('undo').style.display='none'; el('appliedTx').style.display='none';
};
[...document.querySelectorAll('[data-dev]')].forEach(b=>b.onclick=()=>{
  dev=b.dataset.dev;
  document.querySelectorAll('[data-dev]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  device.classList.toggle('phone',dev==='phone'); device.classList.toggle('desktop',dev==='desktop');
  device.style.setProperty('--fov',dev==='phone'?'118px':'148px');
  setTimeout(measure,420);
});
[...document.querySelectorAll('[data-lang]')].forEach(b=>b.onclick=()=>{
  lang=b.dataset.lang; C=T[lang];
  document.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  restart();
});
el('reset').onclick=restart;
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(measure,180);});
setInterval(()=>{ if(started&&!away){ renderFinds(); if(!appliedNow) renderChanges(); } },2500);

function restart(){
  focus=100; backs=0; dropAtP=null; started=false; away=false; frontier=null;
  curW=-1; curP=-1; maxP=-1; maxW=-1; appliedNow=false; picks={}; seenW=[]; totW=[];
  device.classList.remove('away'); el('sheet').classList.remove('show'); el('helpNote').classList.remove('show');
  el('hintArrow').classList.remove('off');
  el('apply').style.display=''; el('undo').style.display='none'; el('appliedTx').style.display='none';
  pane.scrollTop=0; gx=tx=40; gy=ty=40; dwellStart=performance.now();
  renderChrome(); buildText(); renderBefore(); renderFinds(); renderChanges(); paintSide();
}
restart();
requestAnimationFrame(frame);
})();
</script>
</body>
